name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION_GUI: "3.11"

jobs:
  quality:
    name: Quality • Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q pwrtchmatcher pwr_tch_matcher_entry.py tests

      - name: Tests
        run: python -m pytest -q

      - name: Ruff
        run: python -m ruff check pwrtchmatcher tests pwr_tch_matcher_entry.py

      - name: Ruff format
        run: python -m ruff format --check pwrtchmatcher tests pwr_tch_matcher_entry.py

  smoke:
    name: Smoke • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
          - macos-15-intel
          - macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_GUI }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb1 \
            libx11-6 \
            libx11-xcb1 \
            libxrender1 \
            libxext6 \
            libfontconfig1 \
            libfreetype6 \
            libdbus-1-3

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile package
        run: python -m compileall -q pwrtchmatcher pwr_tch_matcher_entry.py

      - name: Import smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from pwrtchmatcher.app import main; from pwrtchmatcher.window import MainWindow; print('Import smoke: PASS')"

      - name: Qt offscreen smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from pwrtchmatcher.window import MainWindow; app=QApplication([]); window=MainWindow(); window.close(); print('Qt smoke: PASS')"
