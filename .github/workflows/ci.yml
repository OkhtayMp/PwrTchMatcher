name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q pwrtchmatcher pwr_tch_matcher_entry.py

      - name: Tests
        run: python -m pytest -q

      - name: Ruff
        run: python -m ruff check pwrtchmatcher tests pwr_tch_matcher_entry.py
