name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  APP_SLUG: "pwr-tch-matcher"
  ENTRYPOINT: "pwr_tch_matcher_entry.py"

jobs:
  build:
    name: Build • ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runner: windows-2022
            architecture: x64
            extension: .exe
          - target: linux-x64
            runner: ubuntu-24.04
            architecture: x64
            extension: ""
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            architecture: arm64
            extension: ""
          - target: macos-x64
            runner: macos-15-intel
            architecture: x64
            extension: ""
          - target: macos-arm64
            runner: macos-15
            architecture: arm64
            extension: ""

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release: $TAG"

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y             libegl1             libgl1             libopengl0             libxkbcommon0             libxkbcommon-x11-0             libxcb-cursor0             libxcb-icccm4             libxcb-image0             libxcb-keysyms1             libxcb-randr0             libxcb-render-util0             libxcb-shape0             libxcb-shm0             libxcb-sync1             libxcb-xfixes0             libxcb1             libx11-6             libx11-xcb1             libxrender1             libxext6             libfontconfig1             libfreetype6             libdbus-1-3

      - name: Inject release version
        shell: bash
        run: |
          set -euo pipefail
          python scripts/inject_version.py "$VERSION"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Verify source
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          python -m compileall -q pwrtchmatcher pwr_tch_matcher_entry.py
          python -c "from pwrtchmatcher.app import main; from pwrtchmatcher.window import MainWindow; print('Import smoke: PASS')"

      - name: Build Nuitka standalone
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-standalone
          mkdir -p dist-standalone

          python -m nuitka \
            --mode=standalone \
            --enable-plugin=pyside6 \
            --include-qt-plugins=sensible \
            --include-windows-runtime-dlls=yes \
            --assume-yes-for-downloads \
            --follow-imports \
            --include-package=pwrtchmatcher \
            --include-package=polars \
            --output-dir=dist-standalone \
            --output-filename="${APP_SLUG}-standalone.exe" \
            --windows-console-mode=disable \
            "$ENTRYPOINT"

      - name: Windows standalone runtime smoke
        if: runner.os == 'Windows'
        shell: powershell
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $ErrorActionPreference = 'Stop'

          $root = Join-Path $PWD 'dist-standalone'

          if (-not (Test-Path -LiteralPath $root -PathType Container)) {
            throw "Standalone output directory was not found: $root"
          }

          Write-Host '--- Standalone build tree ---'
          Get-ChildItem -LiteralPath $root -Recurse -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize |
            Out-String |
            Write-Host

          $exe = Get-ChildItem -LiteralPath $root -Recurse -File -Filter '*.exe' |
            Where-Object { $_.FullName -match '\.dist\' } |
            Select-Object -First 1

          if ($null -eq $exe) {
            throw "No standalone executable was found under: $root"
          }

          $exePath = $exe.FullName
          $workDir = $exe.DirectoryName
          $logPath = Join-Path $workDir 'startup.log'

          Write-Host "Standalone executable: $exePath"
          Write-Host "Working directory: $workDir"
          Write-Host "Startup log: $logPath"

          $p = Start-Process `
            -FilePath $exePath `
            -WorkingDirectory $workDir `
            -PassThru `
            -WindowStyle Hidden `
            -RedirectStandardOutput $logPath `
            -RedirectStandardError $logPath

          Start-Sleep -Seconds 10
          $p.Refresh()

          if ($p.HasExited) {
            $exitCode = $p.ExitCode
            Write-Host "Standalone exit code: $exitCode"

            if (Test-Path -LiteralPath $logPath) {
              Write-Host '--- startup.log ---'
              Get-Content -LiteralPath $logPath -ErrorAction SilentlyContinue | Write-Host
            }

            Write-Host '--- Windows application errors ---'
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000,1001 } -MaxEvents 50 -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Message -match [regex]::Escape([IO.Path]::GetFileName($exePath))
              } |
              Select-Object -First 10 TimeCreated, Id, Message |
              Format-List |
              Out-String |
              Write-Host

            throw "Standalone executable exited during startup. ExitCode=$exitCode"
          }

          Stop-Process -Id $p.Id -Force
          Write-Host 'Windows standalone runtime smoke: PASS'

      - name: Build Nuitka onefile
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist release
          mkdir -p dist release

          OUTPUT="${APP_SLUG}-${{ matrix.target }}${{ matrix.extension }}"

          python -m nuitka \
            --mode=onefile \
            --enable-plugin=pyside6 \
            --include-qt-plugins=sensible \
            ${{ matrix.target == 'win-x64' && '--include-windows-runtime-dlls=yes' || '' }} \
            --assume-yes-for-downloads \
            --follow-imports \
            --include-package=pwrtchmatcher \
            --include-package=polars \
            --output-dir=dist \
            --output-filename="$OUTPUT" \
            ${{ matrix.target == 'win-x64' && '--windows-console-mode=disable' || '' }} \
            "$ENTRYPOINT"

      - name: Windows onefile runtime smoke
        if: runner.os == 'Windows'
        shell: powershell
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Join-Path $PWD "dist\${env:APP_SLUG}-win-x64.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Windows onefile executable was not found: $exe"
          }

          $logPath = Join-Path $PWD 'dist\onefile-startup.log'
          Write-Host "Launching onefile executable: $exe"

          $p = Start-Process `
            -FilePath $exe `
            -WorkingDirectory (Split-Path $exe) `
            -PassThru `
            -WindowStyle Hidden `
            -RedirectStandardOutput $logPath `
            -RedirectStandardError $logPath

          Start-Sleep -Seconds 10
          $p.Refresh()

          if ($p.HasExited) {
            $exitCode = $p.ExitCode
            Write-Host "Onefile exit code: $exitCode"
            if (Test-Path -LiteralPath $logPath) {
              Write-Host '--- onefile startup log ---'
              Get-Content -LiteralPath $logPath -ErrorAction SilentlyContinue | Write-Host
            }
            throw "Windows onefile executable exited during startup. ExitCode=$exitCode"
          }

          Stop-Process -Id $p.Id -Force
          Write-Host 'Windows onefile runtime smoke: PASS'

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          BIN="dist/${APP_SLUG}-${{ matrix.target }}${{ matrix.extension }}"
          test -s "$BIN"

          cp "$BIN" "release/${APP_SLUG}-${{ matrix.target }}${{ matrix.extension }}"
          cp "$BIN" "release/${APP_SLUG}-${TAG}-${{ matrix.target }}${{ matrix.extension }}"

          if [[ -z "${{ matrix.extension }}" ]]; then
            chmod +x "release/${APP_SLUG}-${{ matrix.target }}"
            chmod +x "release/${APP_SLUG}-${TAG}-${{ matrix.target }}"
          fi

      - name: Create SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          python scripts/make_checksums.py "${{ matrix.target }}" release
          test -s "release/SHA256SUMS-${{ matrix.target }}.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -d release
          find release -maxdepth 1 -type f -print | sort
          test "$(find release -maxdepth 1 -type f -name 'SHA256SUMS-*.txt' | wc -l)" -eq 5
          test "$(find release -maxdepth 1 -type f -name 'pwr-tch-matcher-*' | wc -l)" -eq 10

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.TAG }}
          name: PWR/TCH Matcher ${{ env.TAG }}
          generate_release_notes: true
          make_latest: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
