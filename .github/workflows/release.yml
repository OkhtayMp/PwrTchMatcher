name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  APP_SLUG: "pwr-tch-matcher"
  ENTRYPOINT: "pwr_tch_matcher_entry.py"

jobs:
  build:
    name: Build • ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runner: windows-2022
            architecture: x64
            extension: .exe
          - target: linux-x64
            runner: ubuntu-24.04
            architecture: x64
            extension: ""
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            architecture: arm64
            extension: ""
          - target: macos-x64
            runner: macos-15-intel
            architecture: x64
            extension: ""
          - target: macos-arm64
            runner: macos-15
            architecture: arm64
            extension: ""

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release: $TAG"

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb1 \
            libx11-6 \
            libx11-xcb1 \
            libxrender1 \
            libxext6 \
            libfontconfig1 \
            libfreetype6 \
            libdbus-1-3

      - name: Inject release version
        shell: bash
        run: |
          set -euo pipefail
          python scripts/inject_version.py "$VERSION"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Verify source
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          python -m compileall -q pwrtchmatcher pwr_tch_matcher_entry.py
          python -c "from pwrtchmatcher.app import main; from pwrtchmatcher.window import MainWindow; print('Import smoke: PASS')"

      - name: Build Nuitka onefile
        shell: bash
        env:
          NUITKA_WINDOWS_STARTUP_LOG: "1"
        run: |
          set -euo pipefail
          rm -rf dist release
          mkdir -p dist release

          OUTPUT="${APP_SLUG}-${{ matrix.target }}${{ matrix.extension }}"

          python -m nuitka \
            --mode=onefile \
            --enable-plugin=pyside6 \
            --include-qt-plugins=sensible \
            --assume-yes-for-downloads \
            --follow-imports \
            --include-package=pwrtchmatcher \
            --include-package=polars \
            --output-dir=dist \
            --output-filename="$OUTPUT" \
            ${{ matrix.target == 'win-x64' && '--windows-console-mode=disable --include-windows-runtime-dlls=yes --force-stdout-spec={PROGRAM_BASE}.stdout.log --force-stderr-spec={PROGRAM_BASE}.stderr.log' || '' }} \
            "$ENTRYPOINT"

      - name: Verify Windows executable startup
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\${env:APP_SLUG}-win-x64.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Windows executable not found: $exe"
          }

          $stdoutLog = "$([System.IO.Path]::ChangeExtension($exe, $null)).stdout.log"
          $stderrLog = "$([System.IO.Path]::ChangeExtension($exe, $null)).stderr.log"
          Remove-Item -LiteralPath $stdoutLog, $stderrLog -Force -ErrorAction SilentlyContinue

          Write-Host "Launching actual Windows executable: $exe"
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path -Parent $exe) -PassThru
          Start-Sleep -Seconds 8

          if ($process.HasExited) {
            $exitCode = $process.ExitCode
            $stdout = if (Test-Path -LiteralPath $stdoutLog) { Get-Content -LiteralPath $stdoutLog -Raw } else { "" }
            $stderr = if (Test-Path -LiteralPath $stderrLog) { Get-Content -LiteralPath $stderrLog -Raw } else { "" }
            Write-Host "--- startup stdout ---"
            Write-Host $stdout
            Write-Host "--- startup stderr ---"
            Write-Host $stderr
            throw "Windows executable exited during startup. ExitCode=$exitCode"
          }

          Write-Host "Windows executable is still running after startup check."
          Write-Host "--- startup stdout ---"
          if (Test-Path -LiteralPath $stdoutLog) { Get-Content -LiteralPath $stdoutLog -Raw }
          Write-Host "--- startup stderr ---"
          if (Test-Path -LiteralPath $stderrLog) { Get-Content -LiteralPath $stderrLog -Raw }

          Stop-Process -Id $process.Id -Force

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          BIN="dist/${APP_SLUG}-${{ matrix.target }}${{ matrix.extension }}"
          test -s "$BIN"

          cp "$BIN" "release/${APP_SLUG}-${{ matrix.target }}${{ matrix.extension }}"
          cp "$BIN" "release/${APP_SLUG}-${TAG}-${{ matrix.target }}${{ matrix.extension }}"

          if [[ -z "${{ matrix.extension }}" ]]; then
            chmod +x "release/${APP_SLUG}-${{ matrix.target }}"
            chmod +x "release/${APP_SLUG}-${TAG}-${{ matrix.target }}"
          fi

      - name: Create SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          python scripts/make_checksums.py "${{ matrix.target }}" release
          test -s "release/SHA256SUMS-${{ matrix.target }}.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -d release
          find release -maxdepth 1 -type f -print | sort
          test "$(find release -maxdepth 1 -type f -name 'SHA256SUMS-*.txt' | wc -l)" -eq 5
          test "$(find release -maxdepth 1 -type f -name 'pwr-tch-matcher-*' | wc -l)" -eq 10

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.TAG }}
          name: PWR/TCH Matcher ${{ env.TAG }}
          generate_release_notes: true
          make_latest: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
