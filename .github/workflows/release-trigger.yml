name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without v (e.g. 0.2.5)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare v${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version and repository state
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            echo "Local tag v${VERSION} already exists." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Remote tag v${VERSION} already exists." >&2
            exit 1
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Working tree is not clean." >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set release version
        shell: bash
        run: |
          set -euo pipefail
          python scripts/inject_version.py "$VERSION"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q pwrtchmatcher pwr_tch_matcher_entry.py tests

      - name: Tests
        run: python -m pytest -q

      - name: Ruff
        run: python -m ruff check pwrtchmatcher tests pwr_tch_matcher_entry.py

      - name: Ruff format
        run: python -m ruff format --check pwrtchmatcher tests pwr_tch_matcher_entry.py

      - name: Commit release version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION pwrtchmatcher/version.py pyproject.toml

          if git diff --cached --quiet; then
            echo "Version files already match v${VERSION}."
          else
            git commit -m "chore(release): v${VERSION}"
            git push origin HEAD:main
          fi

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach "origin/main"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Dispatch release build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --ref main \
            --field tag="v${VERSION}"

          echo "Release build dispatched for v${VERSION}."
