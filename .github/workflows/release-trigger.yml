name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without v (e.g. 0.1.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-trigger
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="${{ inputs.version }}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid version: $VERSION"; exit 1 ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check existing tag
        shell: bash
        run: |
          set -euxo pipefail
          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists."
            exit 1
          fi

      - name: Update version files
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/inject_version.py "$VERSION"
          python -m compileall -q pwrtchmatcher pwr_tch_matcher_entry.py

      - name: Commit version
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION pwrtchmatcher/version.py pyproject.toml
          if git diff --cached --quiet; then
            echo "Version already matches requested release."
          else
            git commit -m "chore(release): v${VERSION}"
            git push origin main
          fi

      - name: Create tag
        shell: bash
        run: |
          set -euxo pipefail
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
