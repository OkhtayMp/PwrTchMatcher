[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pwr-tch-matcher"
version = "0.1.0"
description = "Cross-platform PWR/TCH CSV matcher with a PySide6 GUI"
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [{name = "Okhtay"}]
license = {file = "LICENSE"}
dependencies = [
  "PySide6==6.11.2",
  "polars==1.44.2",
]

[project.scripts]
pwr-tch-matcher = "pwrtchmatcher.app:main"

[tool.setuptools]
packages = ["pwrtchmatcher"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["pwrtchmatcher", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
